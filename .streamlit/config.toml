[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1d23"
borderColor = "#e3e6ea"
dataframeHeaderBackgroundColor = "#f3f5f8"
linkColor = "#2a78d6"
baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#0f1b2d"
secondaryBackgroundColor = "#1a2a42"
textColor = "#e6ebf2"
borderColor = "#2a3b55"
primaryColor = "#6da7ec"

[client]
toolbarMode = "minimal"
